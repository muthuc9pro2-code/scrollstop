services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 996232
      MYSQL_DATABASE: scrollstop
    ports:
      - "3307:3306"
    volumes:
      - "mysql-data:/var/lib/mysql"
    networks:
      - scrollstop-network

  backend:
    image: scrollstop-backend:v1
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    env_file:
      - ./backend/.env
    container_name: scrollstop-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - scrollstop-network

  frontend:
    image: scrollstop-frontend:v1
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    env_file:
      - ./frontend/.env
    container_name: scrollstop-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - scrollstop-network

networks:
  scrollstop-network:

volumes:
  mysql-data:

